<!doctype html>
<html lang="en">
  <head>
<!--    <script type="module" src="src/main.tsx"></script>-->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Дневник СПО</title>
    <script>
      try {
        var root = document.documentElement
        var savedTheme = localStorage.getItem('themePreference')
        var oledPref = localStorage.getItem('oledPreference') === '1'
        if (savedTheme === 'oled') {
          savedTheme = 'dark'
          oledPref = true
          localStorage.setItem('themePreference', 'dark')
          localStorage.setItem('oledPreference', '1')
        }
        var isDark =
          savedTheme === 'dark' ||
          (savedTheme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var isOled = oledPref && isDark
        root.style.background = isOled
          ? '#000000'
          : isDark
            ? '#0a0a0a'
            : '#ffffff'
        if (isOled) root.classList.add('diary-oled')

        var accents = {
          blue: ['#2688eb', '#2483e4', '#237edd'],
          sky: ['#4ca0f5', '#4598eb', '#3f90e0'],
          indigo: ['#5b6cff', '#5564f2', '#4f5de5'],
          violet: ['#792ec0', '#722cb6', '#6b29ab'],
          pink: ['#e73d8c', '#db3a85', '#cf367e'],
          red: ['#e64646', '#db4343', '#cf3f3f'],
          orange: ['#f08722', '#e48020', '#d8791e'],
          green: ['#4bb34b', '#47aa47', '#43a043'],
          teal: ['#18a3a8', '#169b9f', '#149297']
        }
        var savedAccent = localStorage.getItem('accentPreference')
        var accent
        if (savedAccent === 'system') {
          var systemColor = '#2688eb'
          try {
            if (!CSS.supports || CSS.supports('color', 'AccentColor')) {
              var probe = document.createElement('span')
              probe.style.cssText =
                'all:initial;position:fixed;left:-9999px;color:AccentColor'
              root.appendChild(probe)
              var value = getComputedStyle(probe).color
              probe.remove()
              var match = value && value.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i)
              if (match) {
                var r = Number(match[1]) / 255
                var g = Number(match[2]) / 255
                var b = Number(match[3]) / 255
                var lin = function (c) {
                  return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
                }
                var lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b)
                if (lum > 0.08 && lum < 0.72) systemColor = value
              }
            }
          } catch (err) {}
          accent = [
            systemColor,
            'color-mix(in srgb, ' + systemColor + ' 92%, black)',
            'color-mix(in srgb, ' + systemColor + ' 84%, black)'
          ]
        } else {
          accent = accents[savedAccent] || accents.blue
        }
        root.style.setProperty('--diary-accent', accent[0])
        root.style.setProperty('--diary-accent-hover', accent[1])
        root.style.setProperty('--diary-accent-active', accent[2])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
