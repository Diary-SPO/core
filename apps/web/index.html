<!doctype html>
<html lang="en">
  <head>
<!--    <script type="module" src="src/main.tsx"></script>-->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Дневник СПО</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('themePreference')
        var isDark =
          savedTheme === 'dark' ||
          (savedTheme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        // color_background, не content: иначе на ПК по бокам колонок
        // светлее html-фон и получаются вертикальные «полосы».
        document.documentElement.style.background = isDark
          ? '#0a0a0a'
          : '#ffffff'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
