name: Mobile web OTA

# Публикует zip фронта Capacitor на diary-spo.github.io/mobile/{stable|beta}/
# без пересборки APK. Пользователи подтягивают бандл через @capgo/capacitor-updater.
#
# Публикуем только если:
#   1) version фронта (apps/mobile/package.json) > versionName APK (build.gradle)
#   2) на канале ещё нет OTA с этой version фронта (manifest.json)
#
# Иначе APK уже несёт этот фронт (или OTA уже выложена) — не собираем.
# workflow_dispatch + force=true обходит гейт.
#
# Каналы: main→stable, pre-main→beta, manual→выбор
# Секрет: PAGES_DEPLOY_TOKEN

on:
  push:
    branches:
      - main
      - pre-main
    paths:
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-ota.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'OTA channel'
        type: choice
        options:
          - stable
          - beta
        default: stable
      notes:
        description: 'Текст обновления для пользователя'
        required: false
        default: 'Улучшения интерфейса и исправления'
      force:
        description: 'Собрать даже если фронт ≤ APK или OTA уже есть'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve channel, version, gate
        id: meta
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
            NOTES="${{ github.event.inputs.notes }}"
            FORCE="${{ github.event.inputs.force }}"
          elif [ "${{ github.ref_name }}" = "pre-main" ]; then
            CHANNEL=beta
            NOTES='Canary / beta интерфейс'
            FORCE=false
          else
            CHANNEL=stable
            NOTES='Улучшения интерфейса и исправления'
            FORCE=false
          fi

          FRONT=$(node -p "require('./apps/mobile/package.json').version")
          APK=$(grep -oP 'versionName "\K[^"]+' apps/mobile/android/app/build.gradle | head -1)
          APK=${APK%%\$*}
          APK=${APK%\"*}

          MANIFEST_URL="https://diary-spo.github.io/mobile/${CHANNEL}/manifest.json"
          PUBLISHED=$(curl -fsSL "$MANIFEST_URL" 2>/dev/null \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" \
            || echo "")

          # semver: a > b ?
          is_newer() {
            node -e "
              const cmp=(a,b)=>{
                const pa=a.split('.').map(x=>parseInt(x,10)||0);
                const pb=b.split('.').map(x=>parseInt(x,10)||0);
                const n=Math.max(pa.length,pb.length);
                for(let i=0;i<n;i++){
                  const d=(pa[i]||0)-(pb[i]||0);
                  if(d) process.exit(d>0?0:1);
                }
                process.exit(1);
              };
              cmp(process.argv[1], process.argv[2]);
            " "$1" "$2"
          }

          PUBLISH=false
          REASON=""

          if [ "$FORCE" = "true" ]; then
            PUBLISH=true
            REASON="force"
          elif ! is_newer "$FRONT" "$APK"; then
            REASON="фронт $FRONT ≤ APK $APK — OTA не нужна (уже в сторе/APK)"
          elif [ -n "$PUBLISHED" ] && [ "$PUBLISHED" = "$FRONT" ]; then
            REASON="OTA $FRONT уже на $CHANNEL"
          else
            PUBLISH=true
            REASON="фронт $FRONT > APK $APK, published=${PUBLISHED:-none}"
          fi

          {
            echo "channel=$CHANNEL"
            echo "notes=$NOTES"
            echo "version=$FRONT"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "gate: publish=$PUBLISH ($REASON) → mobile/$CHANNEL"

      - name: Install zip
        if: steps.meta.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install dependencies
        if: steps.meta.outputs.publish == 'true'
        run: bun install

      - name: Write mobile .env
        if: steps.meta.outputs.publish == 'true'
        run: |
          cat > apps/mobile/.env <<'EOF'
          VITE_DIARY_URL=https://poo.tomedu.ru
          VITE_PRIVACY_POLICY_URL=https://disk.yandex.ru/i/q3875_7h9oPdvA
          VITE_USER_AGREEMENT_URL=https://disk.yandex.ru/i/ylPeDklUN5GVCQ
          VITE_PERSONAL_DATA_CONSENT_URL=https://disk.yandex.ru/i/oxnrYLEWNJY7bQ
          EOF

      - name: Build mobile web bundle
        if: steps.meta.outputs.publish == 'true'
        env:
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
        run: bun run --cwd apps/mobile build

      - name: Pack OTA zip + manifest
        if: steps.meta.outputs.publish == 'true'
        env:
          OTA_VERSION: ${{ steps.meta.outputs.version }}
          OTA_CHANNEL: ${{ steps.meta.outputs.channel }}
          OTA_NOTES: ${{ steps.meta.outputs.notes }}
        run: bun apps/mobile/scripts/pack-ota.mjs

      - name: Deploy to diary-spo.github.io/mobile/${{ steps.meta.outputs.channel }}
        if: steps.meta.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: Diary-SPO/diary-spo.github.io
          publish_branch: main
          publish_dir: apps/mobile/ota-dist
          destination_dir: mobile/${{ steps.meta.outputs.channel }}
          keep_files: true
